// GAME FLOW
// ============================================================================

function submitAnswer() {
  const challenge = challenges[currentStep];

  if (challenge.validate()) {
    humanityScore += rand(1, 5);

    // Randomly show achievements
    const achievements = [
      ['🧠 Big Brain', 'You solved a challenge!'],
      ['⏱️ Speed Demon', 'That was fast... suspiciously fast.'],
      ['🎯 Sharp Eye', 'You found what you were looking for!'],
      ['🤔 Deep Thinker', 'Your response showed human-like depth.'],
      ['💪 Persistent', 'You didn\'t give up. Very human.'],
      ['🎨 Creative', 'Your response was uniquely human.'],
      ['📝 Literate', 'You can read AND write!'],
      ['🎮 Gamer', 'Nice gaming skills!'],
      ['🔬 Scientist', 'Impressive analytical abilities!'],
      ['🎭 Drama Queen', 'You really committed to that answer.'],
    ];

    if (Math.random() > 0.6) {
      const [title, desc] = pick(achievements);
      showAchievement(title, desc);
    }

    currentStep++;

    if (currentStep >= totalSteps) {
      showCompletion();
      return;
    }

    updateProgress();
    stepStartTime = Date.now();
    challenges[currentStep].setup();
  } else {
    // Wrong answer feedback
    humanityScore = Math.max(0, humanityScore - 2);
    const body = getBody();
    const existing = body.querySelector('.captcha-error');
    if (existing) existing.remove();

    const err = document.createElement('div');
    err.className = 'captcha-error';
    err.textContent = pick([
      '❌ Incorrect. A human would have gotten that right... probably.',
      '❌ Wrong answer. Humanity score decreased.',
      '❌ That\'s not right. Are you sure you\'re human?',
      '❌ Incorrect response detected. Bot probability increased.',
      '❌ Nope. Try again, alleged human.',
      '❌ Wrong. Even a robot could do better. Wait...',
    ]);
    body.appendChild(err);

    // Shake the container
    const container = document.getElementById('captcha-container');
    container.style.animation = 'none';
    container.offsetHeight; // Trigger reflow
    container.style.animation = 'shake 0.5s ease';
  }
}

function showCompletion() {
  // Stop any running intervals/animations
  const header = document.getElementById('captcha-header');
  header.style.background = '#2ecc71';
  document.getElementById('header-title').textContent = '✅ Verification Complete';
  document.getElementById('step-counter').textContent = `${totalSteps}/${totalSteps}`;
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-bar').style.background = '#2ecc71';

  const elapsed = Math.round(totalTime / 1000);
  const minutes = Math.floor(elapsed / 60);
  const seconds = elapsed % 60;

  let html = `<div class="completion-screen">`;
  html += `<h2>🎉 Congratulations, Human!</h2>`;
  html += `<div style="font-size:14px;color:#444;margin-bottom:16px">You have been verified as <strong>probably human</strong>.</div>`;

  html += `<div class="humanity-score" style="margin:16px 0">`;
  html += `<div class="humanity-bar"><div class="humanity-fill" style="width:${Math.min(100, humanityScore)}%"></div></div>`;
  html += `<div class="humanity-label"><span>Robot</span><span>Final Score: ${humanityScore}%</span><span>Human</span></div>`;
  html += `</div>`;

  html += `<div style="font-size:12px;color:#888;margin:12px 0">`;
  html += `<div>Steps completed: ${totalSteps}</div>`;
  html += `<div>Time elapsed: ${minutes}m ${seconds}s</div>`;
  html += `<div>Humanity confidence: ${Math.min(99, humanityScore + rand(10, 30))}%</div>`;
  html += `<div style="margin-top:8px;font-size:10px;color:#bbb">(Note: 100% confidence is philosophically impossible)</div>`;
  html += `</div>`;

  html += `<div style="margin-top:16px;padding:12px;background:#f8f8f8;border-radius:4px;font-size:11px;color:#666">`;
  html += `Your verification token: <code style="background:#e8e8e8;padding:2px 6px;border-radius:3px">${generateToken()}</code>`;
  html += `<div style="margin-top:4px;font-size:9px;color:#999">This token expires in 30 seconds. Just kidding. Or are we?</div>`;
  html += `</div>`;

  html += `<button class="btn-verify" style="margin-top:16px;padding:12px 32px" onclick="location.reload()">Do It All Again</button>`;
  html += `</div>`;

  getBody().innerHTML = html;
  document.getElementById('footer-buttons').innerHTML = '';

  // Confetti!
  launchConfetti();
}

function generateToken() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let token = '';
  for (let i = 0; i < 32; i++) token += chars[rand(0, chars.length - 1)];
  return token;
}

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');

  const particles = [];
  const colors = ['#e74c3c', '#f39c12', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e91e63'];

  for (let i = 0; i < 150; i++) {
    particles.push({
      x: rand(0, canvas.width),
      y: rand(-canvas.height, 0),
      vx: randFloat(-3, 3),
      vy: randFloat(2, 6),
      size: rand(4, 10),
      color: pick(colors),
      rotation: randFloat(0, Math.PI * 2),
      rotSpeed: randFloat(-0.1, 0.1)
    });
  }

  const animate = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let allDone = true;
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.rotation += p.rotSpeed;

      if (p.y < canvas.height + 20) {
        allDone = false;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      }
    }

    if (!allDone) {
      requestAnimationFrame(animate);
    } else {
      canvas.style.display = 'none';
    }
  };

  requestAnimationFrame(animate);
}

// Add shake animation
const style = document.createElement('style');
style.textContent = `
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
  }
`;
document.head.appendChild(style);

// ============================================================================
// INITIALIZATION
// ============================================================================

function init() {
  buildChallenges();
  totalSteps = challenges.length;
  currentStep = 0;
  humanityScore = 0;
  stepStartTime = Date.now();

  // Timer
  setInterval(() => {
    totalTime = Date.now() - stepStartTime;
  }, 1000);

  updateProgress();
  challenges[0].setup();

  // Show initial achievement
  setTimeout(() => {
    showAchievement('🚀 Journey Begins', `${totalSteps} steps stand between you and humanity`);
  }, 1000);
}

init();
</script>
