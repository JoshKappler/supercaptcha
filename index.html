<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCAPTCHA - Verify You Are Human</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f0f0f0;
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  #captcha-container {
    background: #fff;
    border: 1px solid #d3d3d3;
    border-radius: 3px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    width: 400px;
    max-width: 95vw;
    overflow: hidden;
    position: relative;
  }

  #captcha-header {
    background: #4a90d9;
    color: white;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #captcha-header .step-counter {
    font-size: 11px;
    opacity: 0.85;
  }

  #captcha-body {
    padding: 16px;
    min-height: 300px;
    max-height: 80vh;
    overflow-y: auto;
  }

  #captcha-footer {
    padding: 12px 16px;
    background: #fafafa;
    border-top: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .captcha-instruction {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: #1a1a1a;
    line-height: 1.4;
  }

  .captcha-subtext {
    font-size: 12px;
    color: #666;
    margin-bottom: 12px;
  }

  .btn-verify {
    background: #4a90d9;
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-verify:hover { background: #357abd; }
  .btn-verify:disabled { background: #a0c4e8; cursor: not-allowed; }

  .btn-skip {
    background: none;
    border: 1px solid #ccc;
    padding: 8px 16px;
    border-radius: 3px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
  }

  .btn-skip:hover { border-color: #999; }

  /* Progress bar */
  #progress-bar-container {
    height: 4px;
    background: #e0e0e0;
    width: 100%;
  }

  #progress-bar {
    height: 100%;
    background: #4a90d9;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Grid captcha styles */
  .captcha-grid {
    display: grid;
    gap: 2px;
    margin: 8px 0;
  }

  .captcha-grid.g3x3 { grid-template-columns: repeat(3, 1fr); }
  .captcha-grid.g4x4 { grid-template-columns: repeat(4, 1fr); }
  .captcha-grid.g5x5 { grid-template-columns: repeat(5, 1fr); }
  .captcha-grid.g6x6 { grid-template-columns: repeat(6, 1fr); }

  .grid-cell {
    aspect-ratio: 1;
    background: #ddd;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.15s;
  }

  .grid-cell:hover { border-color: #4a90d9; }
  .grid-cell.selected { border-color: #4a90d9; }
  .grid-cell.selected::after {
    content: '✓';
    position: absolute;
    top: 4px;
    right: 4px;
    background: #4a90d9;
    color: white;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
  }

  .grid-cell canvas, .grid-cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Text input style */
  .captcha-input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #ddd;
    border-radius: 3px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .captcha-input:focus { border-color: #4a90d9; }

  .captcha-textarea {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #ddd;
    border-radius: 3px;
    font-size: 13px;
    outline: none;
    resize: vertical;
    min-height: 100px;
    font-family: inherit;
  }

  .captcha-textarea:focus { border-color: #4a90d9; }

  /* Radio / checkbox */
  .captcha-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid #e0e0e0;
    border-radius: 3px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 13px;
  }

  .captcha-option:hover { background: #f5f8fc; }
  .captcha-option.selected { background: #e8f0fe; border-color: #4a90d9; }

  /* Slider */
  .captcha-slider {
    width: 100%;
    margin: 12px 0;
    -webkit-appearance: none;
    height: 8px;
    border-radius: 4px;
    background: #ddd;
    outline: none;
  }

  .captcha-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #4a90d9;
    cursor: pointer;
  }

  .slider-value {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #4a90d9;
  }

  /* Color picker */
  .color-display {
    width: 100%;
    height: 60px;
    border-radius: 4px;
    margin: 8px 0;
    border: 1px solid #ddd;
  }

  .color-sliders { margin: 8px 0; }
  .color-sliders label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    margin-bottom: 4px;
  }

  .color-sliders input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: #ddd;
    outline: none;
  }

  .color-sliders input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #4a90d9;
    cursor: pointer;
  }

  /* Chess board */
  .chess-board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0;
    margin: 8px 0;
    border: 2px solid #333;
    width: 100%;
    aspect-ratio: 1;
  }

  .chess-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
  }

  .chess-cell.light { background: #f0d9b5; }
  .chess-cell.dark { background: #b58863; }
  .chess-cell.selected-chess { outline: 3px solid #4a90d9; outline-offset: -3px; }

  /* Game canvases */
  .game-canvas {
    width: 100%;
    border: 2px solid #333;
    border-radius: 3px;
    display: block;
    background: #000;
  }

  /* Minesweeper */
  .minesweeper-grid {
    display: inline-grid;
    gap: 1px;
    background: #999;
    border: 2px solid #999;
    margin: 8px auto;
  }

  .mine-cell {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    background: #ccc;
    border: 2px outset #eee;
  }

  .mine-cell.revealed {
    background: #ddd;
    border: 1px solid #999;
  }

  .mine-cell.flagged { background: #fdd; }
  .mine-cell.mine-exploded { background: #f55; }

  .mine-1 { color: blue; }
  .mine-2 { color: green; }
  .mine-3 { color: red; }
  .mine-4 { color: darkblue; }
  .mine-5 { color: brown; }

  /* Timer */
  .timer-display {
    font-size: 11px;
    color: #999;
    font-family: monospace;
  }

  /* Distorted text */
  .distorted-text-container {
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 20px;
    text-align: center;
    margin: 8px 0;
    overflow: hidden;
  }

  /* Philosophy container */
  .philosophy-container {
    background: #f8f4e8;
    border: 1px solid #e0d8c0;
    border-radius: 4px;
    padding: 12px;
    margin: 8px 0;
    font-style: italic;
    font-size: 13px;
    line-height: 1.5;
    color: #555;
  }

  /* Circuit diagram */
  .circuit-canvas {
    width: 100%;
    height: 200px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
  }

  /* Math display */
  .math-display {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 16px;
    text-align: center;
    margin: 8px 0;
    font-size: 18px;
    font-family: 'Times New Roman', serif;
    line-height: 1.8;
  }

  /* Debate container */
  .debate-container {
    border: 1px solid #ddd;
    border-radius: 4px;
    margin: 8px 0;
    max-height: 200px;
    overflow-y: auto;
    padding: 8px;
  }

  .debate-msg {
    padding: 8px 12px;
    border-radius: 12px;
    margin-bottom: 6px;
    max-width: 80%;
    font-size: 13px;
    line-height: 1.4;
  }

  .debate-msg.ai {
    background: #e8e8e8;
    margin-right: auto;
  }

  .debate-msg.human {
    background: #4a90d9;
    color: white;
    margin-left: auto;
  }

  /* Drag & drop */
  .drag-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0;
    min-height: 40px;
    padding: 8px;
    border: 2px dashed #ddd;
    border-radius: 4px;
  }

  .drag-item {
    padding: 6px 12px;
    background: #4a90d9;
    color: white;
    border-radius: 3px;
    cursor: grab;
    font-size: 13px;
    user-select: none;
  }

  .drag-item:active { cursor: grabbing; }

  .drop-zone {
    min-height: 40px;
    padding: 8px;
    border: 2px dashed #4a90d9;
    border-radius: 4px;
    margin: 4px 0;
    background: #f5f8fc;
    font-size: 12px;
    color: #888;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  /* Emoji */
  .emoji-display {
    font-size: 48px;
    text-align: center;
    padding: 16px;
  }

  /* Loading spinner for fake processing */
  .fake-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 40px 0;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #e0e0e0;
    border-top-color: #4a90d9;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .fake-loading-text {
    font-size: 12px;
    color: #888;
  }

  /* Waveform visualizer */
  .waveform-canvas {
    width: 100%;
    height: 60px;
    background: #1a1a1a;
    border-radius: 4px;
  }

  /* Photo grid for species identification */
  .photo-container {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 4px;
    overflow: hidden;
    margin: 8px 0;
    position: relative;
  }

  .photo-container canvas {
    width: 100%;
    height: 100%;
  }

  /* Warning messages */
  .captcha-warning {
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 3px;
    padding: 8px 12px;
    font-size: 12px;
    color: #856404;
    margin: 8px 0;
  }

  .captcha-error {
    background: #f8d7da;
    border: 1px solid #f5c6cb;
    border-radius: 3px;
    padding: 8px 12px;
    font-size: 12px;
    color: #721c24;
    margin: 8px 0;
  }

  .captcha-success {
    background: #d4edda;
    border: 1px solid #c3e6cb;
    border-radius: 3px;
    padding: 8px 12px;
    font-size: 12px;
    color: #155724;
    margin: 8px 0;
  }

  /* Fingerprint sensor */
  .fingerprint-zone {
    width: 120px;
    height: 150px;
    margin: 12px auto;
    border: 3px solid #ddd;
    border-radius: 12px;
    background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .fingerprint-zone:hover {
    border-color: #4a90d9;
    background: linear-gradient(135deg, #e8f0fe, #d0e0f0);
  }

  .fingerprint-zone.scanning {
    border-color: #4a90d9;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74,144,217,0.4); }
    50% { box-shadow: 0 0 0 10px rgba(74,144,217,0); }
  }

  /* Personality quiz */
  .likert-scale {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
    gap: 4px;
  }

  .likert-option {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border: 1px solid #ddd;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
  }

  .likert-option:hover { background: #f5f8fc; }
  .likert-option.selected { background: #4a90d9; color: white; border-color: #4a90d9; }

  /* Drawing canvas */
  .drawing-canvas {
    width: 100%;
    height: 200px;
    border: 2px solid #ddd;
    border-radius: 4px;
    cursor: crosshair;
    background: white;
  }

  /* Sorting area */
  .sort-list {
    list-style: none;
    margin: 8px 0;
  }

  .sort-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 3px;
    margin-bottom: 4px;
    cursor: grab;
    font-size: 13px;
  }

  .sort-item:active { cursor: grabbing; background: #e8f0fe; }
  .sort-handle { color: #999; cursor: grab; }

  /* CAPTCHA legal text */
  .legal-text {
    font-size: 10px;
    color: #999;
    line-height: 1.4;
    margin-top: 8px;
  }

  /* Level badge */
  .level-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .level-easy { background: #d4edda; color: #155724; }
  .level-medium { background: #fff3cd; color: #856404; }
  .level-hard { background: #f8d7da; color: #721c24; }
  .level-insane { background: #721c24; color: white; }
  .level-transcendent { background: #1a1a1a; color: #fff; animation: rainbow 3s linear infinite; }

  @keyframes rainbow {
    0% { color: #ff0000; }
    16% { color: #ff8800; }
    33% { color: #ffff00; }
    50% { color: #00ff00; }
    66% { color: #0088ff; }
    83% { color: #8800ff; }
    100% { color: #ff0000; }
  }

  /* Attractiveness rating */
  .rating-face {
    width: 100%;
    aspect-ratio: 3/4;
    max-height: 200px;
    border-radius: 4px;
    margin: 8px 0;
    background: #eee;
    overflow: hidden;
  }

  .rating-face canvas {
    width: 100%;
    height: 100%;
  }

  /* Scroll text */
  .scroll-container {
    max-height: 150px;
    overflow-y: auto;
    border: 1px solid #ddd;
    padding: 12px;
    margin: 8px 0;
    font-size: 11px;
    line-height: 1.6;
    color: #444;
  }

  /* Number display */
  .number-display {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    background: #f8f8f8;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin: 8px 0;
    word-break: break-all;
    line-height: 1.4;
  }

  /* Musical staff */
  .music-staff {
    width: 100%;
    height: 120px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin: 8px 0;
  }

  /* Constellation */
  .constellation-canvas {
    width: 100%;
    height: 250px;
    background: #0a0a2e;
    border-radius: 4px;
    margin: 8px 0;
  }

  /* Where's waldo style */
  .waldo-container {
    width: 100%;
    height: 300px;
    overflow: hidden;
    border: 2px solid #ddd;
    border-radius: 4px;
    margin: 8px 0;
    cursor: crosshair;
    position: relative;
  }

  .waldo-container canvas {
    width: 100%;
    height: 100%;
  }

  /* Morality meter */
  .morality-meter {
    width: 100%;
    height: 30px;
    background: linear-gradient(to right, #ff0000, #ffff00, #00ff00);
    border-radius: 15px;
    margin: 12px 0;
    position: relative;
    border: 2px solid #ddd;
  }

  .morality-pointer {
    width: 20px;
    height: 36px;
    background: #333;
    border-radius: 3px;
    position: absolute;
    top: -3px;
    transform: translateX(-50%);
    cursor: grab;
  }

  /* DNA sequence */
  .dna-sequence {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    background: #f0f8ff;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin: 8px 0;
    line-height: 1.6;
    word-break: break-all;
  }

  .dna-A { color: #e74c3c; }
  .dna-T { color: #3498db; }
  .dna-G { color: #2ecc71; }
  .dna-C { color: #f39c12; }

  /* Regex tester */
  .regex-display {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    background: #1a1a1a;
    color: #0f0;
    padding: 12px;
    border-radius: 4px;
    margin: 8px 0;
  }

  /* Assembly listing */
  .asm-listing {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    background: #1a1a2e;
    color: #a0ffa0;
    padding: 12px;
    border-radius: 4px;
    margin: 8px 0;
    overflow-x: auto;
    line-height: 1.5;
  }

  /* 3D perspective container */
  .perspective-container {
    perspective: 500px;
    margin: 12px 0;
    text-align: center;
  }

  .rotated-text {
    display: inline-block;
    font-size: 24px;
    font-weight: bold;
    padding: 20px;
    background: #f0f0f0;
    border: 1px solid #ddd;
    transform: rotateY(45deg) rotateX(15deg);
    letter-spacing: 4px;
  }

  /* Knob control */
  .knob-container {
    text-align: center;
    margin: 12px 0;
  }

  .knob {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ddd, #999, #ddd);
    border: 3px solid #888;
    margin: 0 auto;
    cursor: grab;
    position: relative;
  }

  .knob-indicator {
    width: 4px;
    height: 30px;
    background: #e74c3c;
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    transform-origin: bottom center;
    border-radius: 2px;
  }

  /* Typewriter effect */
  @keyframes blink-caret {
    0%, 100% { border-right-color: transparent; }
    50% { border-right-color: #333; }
  }

  /* Achievement popup */
  .achievement {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #333;
    color: white;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 1000;
    transform: translateX(400px);
    transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  .achievement.show { transform: translateX(0); }
  .achievement-title { font-weight: bold; font-size: 14px; }
  .achievement-desc { font-size: 11px; opacity: 0.8; margin-top: 2px; }

  /* Rorschach */
  .rorschach-container {
    text-align: center;
    margin: 8px 0;
  }

  .rorschach-container canvas {
    border: 1px solid #ddd;
    border-radius: 4px;
  }

  /* Map */
  .map-canvas {
    width: 100%;
    height: 250px;
    background: #87ceeb;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin: 8px 0;
    cursor: crosshair;
  }

  /* Terms of service */
  .tos-container {
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid #ddd;
    padding: 12px;
    margin: 8px 0;
    font-size: 9px;
    line-height: 1.5;
    color: #666;
    background: #fafafa;
  }

  .tos-container h4 {
    font-size: 10px;
    margin: 8px 0 4px 0;
    color: #333;
  }

  /* Countdown */
  .countdown-display {
    font-family: 'Courier New', monospace;
    font-size: 36px;
    text-align: center;
    color: #e74c3c;
    padding: 8px;
    font-weight: bold;
  }

  .countdown-display.urgent {
    animation: flash 0.5s infinite;
  }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Pixel art editor */
  .pixel-grid {
    display: inline-grid;
    gap: 1px;
    background: #ccc;
    margin: 8px auto;
  }

  .pixel-cell {
    width: 20px;
    height: 20px;
    background: white;
    cursor: pointer;
  }

  /* Confirm humanity bar */
  .humanity-score {
    margin: 8px 0;

<script>
// ============================================================================
// SUPERCAPTCHA - THE WORLD'S MOST DIFFICULT CAPTCHA SYSTEM

let currentStep = 0;
let totalSteps = 0;
let humanityScore = 0;
let stepStartTime = 0;
let totalTime = 0;
let currentAnswer = null;
let challenges = [];
let audioCtx = null;
let mediaStream = null;

// ============================================================================

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randFloat(min, max) { return Math.random() * (max - min) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rand(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showAchievement(title, desc) {

  document.getElementById('achievement-desc').textContent = desc;

}

function updateProgress() {
  const pct = (currentStep / totalSteps) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('step-counter').textContent = `Step ${currentStep + 1} of ${totalSteps}`;
}

function setInstruction(text) {
  return `<div class="captcha-instruction">${text}</div>`;
}

function setSubtext(text) {

}

function setWarning(text) {
  return `<div class="captcha-warning">⚠️ ${text}</div>`;
}

function getLevelBadge(level) {
  const classes = { easy: 'level-easy', medium: 'level-medium', hard: 'level-hard', insane: 'level-insane', transcendent: 'level-transcendent' };
  return `<span class="level-badge ${classes[level] || 'level-hard'}">${level}</span>`;
}

function getBody() { return document.getElementById('captcha-body'); }
function getVerifyBtn() { return document.getElementById('btn-verify'); }

// Generate a seeded random color
function randColor() {
  return `hsl(${rand(0,360)}, ${rand(40,80)}%, ${rand(30,70)}%)`;
}

function drawNoise(ctx, w, h, intensity) {
  const imgData = ctx.getImageData(0, 0, w, h);
  for (let i = 0; i < imgData.data.length; i += 4) {
    if (Math.random() < intensity) {
      const v = rand(0, 255);
      imgData.data[i] = v;
      imgData.data[i+1] = v;
      imgData.data[i+2] = v;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// Draw a mangled, distorted captcha image on a canvas
function drawDistortedImage(canvas, items, type) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = '#f0f0f0';
  ctx.fillRect(0, 0, w, h);

  // Draw random noise/lines
  for (let i = 0; i < 20; i++) {
    ctx.strokeStyle = `rgba(${rand(0,255)},${rand(0,255)},${rand(0,255)},0.3)`;
    ctx.lineWidth = rand(1, 3);
    ctx.beginPath();
    ctx.moveTo(rand(0, w), rand(0, h));
    ctx.bezierCurveTo(rand(0,w), rand(0,h), rand(0,w), rand(0,h), rand(0,w), rand(0,h));
    ctx.stroke();
  }

  if (type === 'bicycle') {
    drawBicycleMess(ctx, w, h);
  } else if (type === 'firetruck') {
    drawCityBirdseye(ctx, w, h);
  } else if (type === 'text') {
    drawDistortedText(ctx, w, h, items);
  }
}

function drawBicycleMess(ctx, w, h) {
  // Draw things that might be bicycles, maybe, who knows
  for (let i = 0; i < 15; i++) {
    const x = rand(10, w - 60);
    const y = rand(10, h - 60);
    const size = rand(15, 40);
    const color = randColor();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(randFloat(-0.5, 0.5));
    ctx.globalAlpha = randFloat(0.3, 0.8);

    // Draw circle-like shapes (wheels? not wheels?)
    ctx.strokeStyle = color;
    ctx.lineWidth = rand(1, 3);
    ctx.beginPath();
    ctx.ellipse(0, 0, size, size * randFloat(0.6, 1.2), randFloat(-0.3, 0.3), 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(size * 1.5, rand(-5, 5), size, size * randFloat(0.7, 1.1), randFloat(-0.3, 0.3), 0, Math.PI * 2);
    ctx.stroke();

    // Draw connecting lines (frame? maybe?)
    ctx.beginPath();
    ctx.moveTo(rand(-5, 5), rand(-5, 5));
    ctx.lineTo(size * 1.5 + rand(-5, 5), rand(-5, 5));
    ctx.lineTo(size * 0.75, -size + rand(-10, 10));
    ctx.closePath();
    ctx.stroke();

    // Handlebars? Or just lines?
    ctx.beginPath();
    ctx.moveTo(size * 0.75, -size);
    ctx.lineTo(size * 0.75 + rand(-15, 15), -size - rand(5, 20));
    ctx.stroke();

    ctx.restore();
  }

  // Add extra confusion shapes
  for (let i = 0; i < 30; i++) {
    ctx.strokeStyle = randColor();
    ctx.globalAlpha = randFloat(0.1, 0.4);
    ctx.lineWidth = rand(1, 2);
    ctx.beginPath();
    ctx.arc(rand(0, w), rand(0, h), rand(5, 30), 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawCityBirdseye(ctx, w, h) {
  // Draw a bird's eye city view so tiny you can barely see anything
  ctx.fillStyle = '#888';
  ctx.fillRect(0, 0, w, h);

  // Roads
  for (let i = 0; i < 20; i++) {
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = rand(2, 5);
    ctx.beginPath();
    if (Math.random() > 0.5) {
      ctx.moveTo(0, rand(0, h));
      ctx.lineTo(w, rand(0, h));
    } else {
      ctx.moveTo(rand(0, w), 0);
      ctx.lineTo(rand(0, w), h);
    }
    ctx.stroke();
  }

  // Buildings (tiny squares)
  for (let i = 0; i < 200; i++) {
    const bw = rand(3, 12);
    const bh = rand(3, 12);
    ctx.fillStyle = `hsl(${rand(0,60)}, ${rand(0,20)}%, ${rand(40,75)}%)`;
    ctx.fillRect(rand(0, w), rand(0, h), bw, bh);
  }

  // Hide a tiny red rectangle somewhere (firetruck)
  for (let i = 0; i < rand(1, 3); i++) {
    ctx.fillStyle = '#cc2222';
    ctx.fillRect(rand(10, w - 10), rand(10, h - 10), rand(3, 6), rand(2, 3));
  }

  // Add some green (parks)
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = `rgba(0,${rand(100,180)},0,0.5)`;
    ctx.fillRect(rand(0, w), rand(0, h), rand(10, 30), rand(10, 30));
  }
}

function drawDistortedText(ctx, w, h, text) {
  ctx.save();
  const chars = text.split('');
  const charWidth = w / (chars.length + 2);

  for (let i = 0; i < chars.length; i++) {
    ctx.save();
    const x = charWidth * (i + 1);
    const y = h / 2 + rand(-20, 20);
    ctx.translate(x, y);
    ctx.rotate(randFloat(-0.6, 0.6));
    ctx.scale(randFloat(0.7, 1.3), randFloat(0.7, 1.3));
    ctx.font = `${rand(20, 36)}px ${pick(['serif', 'sans-serif', 'monospace', 'cursive'])}`;
    ctx.fillStyle = randColor();
    ctx.globalAlpha = randFloat(0.5, 0.9);
    ctx.fillText(chars[i], 0, 0);
    ctx.restore();
  }

  // Strikethrough lines
  for (let i = 0; i < 8; i++) {
    ctx.strokeStyle = randColor();
    ctx.lineWidth = rand(1, 3);
    ctx.globalAlpha = randFloat(0.3, 0.7);
    ctx.beginPath();
    ctx.moveTo(rand(0, w), rand(0, h));
    ctx.lineTo(rand(0, w), rand(0, h));
    ctx.stroke();
  }

  ctx.restore();
}

// Generate a procedural face for attractiveness rating
function drawProceduralFace(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Background
  const skinTone = `hsl(${rand(15, 35)}, ${rand(40, 70)}%, ${rand(50, 80)}%)`;
  ctx.fillStyle = skinTone;
  ctx.fillRect(0, 0, w, h);

  // Face shape
  ctx.fillStyle = skinTone;
  ctx.beginPath();
  ctx.ellipse(w/2, h * 0.45, w * 0.35, h * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = pick(['#1a1a1a', '#4a3728', '#8b6914', '#c2802e', '#d4a373', '#e74c3c']);
  ctx.beginPath();
  ctx.ellipse(w/2, h * 0.25, w * 0.38, h * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  const eyeY = h * 0.4;
  for (let side = -1; side <= 1; side += 2) {
    const eyeX = w/2 + side * w * 0.12;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.ellipse(eyeX, eyeY, rand(8, 14), rand(6, 10), 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = pick(['#4a3728', '#1a6b3f', '#2471a3', '#1a1a1a']);
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, rand(4, 7), 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, rand(2, 4), 0, Math.PI * 2);
    ctx.fill();
  }

  // Nose
  ctx.strokeStyle = `hsl(${rand(15, 35)}, ${rand(40, 70)}%, ${rand(35, 55)}%)`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(w/2, h * 0.38);
  ctx.quadraticCurveTo(w/2 + rand(-8, 8), h * 0.52, w/2, h * 0.53);
  ctx.stroke();

  // Mouth
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(w/2, h * 0.62, rand(10, 20), 0.1, Math.PI - 0.1);
  ctx.stroke();

  // Weird features to make it harder
  if (Math.random() > 0.5) {
    // Add glasses
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.ellipse(w/2 + side * w * 0.12, eyeY, 14, 12, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(w/2 - w * 0.12 + 14, eyeY);
    ctx.lineTo(w/2 + w * 0.12 - 14, eyeY);
    ctx.stroke();
  }

  // Add some noise
  drawNoise(ctx, w, h, 0.02);
}

// Draw a chess position
function getRandomChessPosition() {
  const pieces = {
    'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
    'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
  };

  // Complex middle-game positions
  const positions = [
    'r1bq1rk1/pp2ppbp/2np1np1/2p5/2B1P3/2NP1N2/PPP2PPP/R1BQ1RK1',
    'rnbqk2r/pppp1ppp/5n2/2b1p3/2B1P3/5N2/PPPP1PPP/RNBQK2R',
    'r3k2r/pppq1ppp/2n1bn2/2b1p3/2B1P3/2N2N2/PPPQ1PPP/R3K2R',
    'r2q1rk1/pb1nbppp/1p2pn2/2p5/2PP4/1PN1PN2/PB2BPPP/R2Q1RK1',
    'r1bqkbnr/pppppppp/2n5/8/4P3/8/PPPP1PPP/RNBQKBNR',
    '2r1r1k1/pp1bqppp/3p1n2/4p3/2P1P3/1QN2N2/PP3PPP/R1B1R1K1',
    'rnb1kb1r/pp1p1ppp/1q2pn2/2p5/2PP4/2N2NP1/PP2PP1P/R1BQKB1R',
    'r4rk1/1bqnbppp/pp1ppn2/8/2PNP3/1PN1BP2/P4QPP/R4RK1',
  ];

  const fen = pick(positions);
  const board = [];
  const ranks = fen.split('/');

  for (let r = 0; r < 8; r++) {
    board[r] = [];
    let col = 0;
    for (const ch of ranks[r]) {
      if (ch >= '1' && ch <= '8') {
        for (let j = 0; j < parseInt(ch); j++) {
          board[r][col++] = '';
        }
      } else {
        board[r][col++] = pieces[ch] || '';
      }
    }
  }

  return board;
}

// Draw a Rorschach inkblot
function drawRorschach(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);

  // Generate one half, mirror it
  const halfW = w / 2;
  const blobs = rand(5, 12);

  ctx.fillStyle = 'rgba(20, 20, 20, 0.8)';

  for (let i = 0; i < blobs; i++) {
    const bx = rand(20, halfW - 20);
    const by = rand(20, h - 20);
    const br = rand(10, 50);
    const points = rand(5, 10);

    ctx.beginPath();
    for (let p = 0; p < points; p++) {
      const angle = (p / points) * Math.PI * 2;
      const r = br * randFloat(0.3, 1.5);
      const px = bx + Math.cos(angle) * r;
      const py = by + Math.sin(angle) * r;
      if (p === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();

    // Mirror
    ctx.save();
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.beginPath();
    for (let p = 0; p < points; p++) {
      const angle = (p / points) * Math.PI * 2;
      const r = br * randFloat(0.3, 1.5);
      const px = bx + Math.cos(angle) * r;
      const py = by + Math.sin(angle) * r;
      if (p === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// Draw constellation
function drawConstellation(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Night sky
  ctx.fillStyle = '#0a0a2e';
  ctx.fillRect(0, 0, w, h);

  // Background stars
  for (let i = 0; i < 200; i++) {
    ctx.fillStyle = `rgba(255,255,255,${randFloat(0.1, 0.7)})`;
    ctx.beginPath();
    ctx.arc(rand(0, w), rand(0, h), randFloat(0.5, 1.5), 0, Math.PI * 2);
    ctx.fill();
  }

  // Constellation stars
  const numStars = rand(5, 10);
  const stars = [];
  for (let i = 0; i < numStars; i++) {
    stars.push({ x: rand(30, w - 30), y: rand(30, h - 30) });
  }

  // Draw constellation lines
  ctx.strokeStyle = 'rgba(100, 150, 255, 0.4)';
  ctx.lineWidth = 1;
  for (let i = 0; i < stars.length - 1; i++) {
    ctx.beginPath();
    ctx.moveTo(stars[i].x, stars[i].y);
    ctx.lineTo(stars[i+1].x, stars[i+1].y);
    ctx.stroke();
  }

  // Draw constellation stars (brighter)
  for (const star of stars) {
    ctx.fillStyle = 'rgba(200, 220, 255, 0.9)';
    ctx.beginPath();
    ctx.arc(star.x, star.y, rand(2, 4), 0, Math.PI * 2);
    ctx.fill();

    // Glow
    const grd = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, 8);
    grd.addColorStop(0, 'rgba(200, 220, 255, 0.4)');
    grd.addColorStop(1, 'rgba(200, 220, 255, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(star.x, star.y, 8, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Maze generator
function generateMaze(rows, cols) {
  const maze = Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => ({ top: true, right: true, bottom: true, left: true, visited: false }))
  );

  const stack = [];
  let current = { r: 0, c: 0 };
  maze[0][0].visited = true;
  stack.push(current);

  while (stack.length > 0) {
    const { r, c } = current;
    const neighbors = [];

    if (r > 0 && !maze[r-1][c].visited) neighbors.push({ r: r-1, c, dir: 'top' });
    if (r < rows-1 && !maze[r+1][c].visited) neighbors.push({ r: r+1, c, dir: 'bottom' });
    if (c > 0 && !maze[r][c-1].visited) neighbors.push({ r, c: c-1, dir: 'left' });
    if (c < cols-1 && !maze[r][c+1].visited) neighbors.push({ r, c: c+1, dir: 'right' });

    if (neighbors.length > 0) {
      const next = pick(neighbors);
      maze[next.r][next.c].visited = true;

      if (next.dir === 'top') { maze[r][c].top = false; maze[next.r][next.c].bottom = false; }
      if (next.dir === 'bottom') { maze[r][c].bottom = false; maze[next.r][next.c].top = false; }
      if (next.dir === 'left') { maze[r][c].left = false; maze[next.r][next.c].right = false; }
      if (next.dir === 'right') { maze[r][c].right = false; maze[next.r][next.c].left = false; }

      stack.push(current);
      current = next;
    } else {
      current = stack.pop();
    }
  }

  return maze;
}

function drawMaze(canvas, maze) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const rows = maze.length;
  const cols = maze[0].length;
  const cellW = w / cols;
  const cellH = h / rows;

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = c * cellW;
      const y = r * cellH;
      const cell = maze[r][c];

      if (cell.top) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cellW, y); ctx.stroke(); }
      if (cell.right) { ctx.beginPath(); ctx.moveTo(x + cellW, y); ctx.lineTo(x + cellW, y + cellH); ctx.stroke(); }
      if (cell.bottom) { ctx.beginPath(); ctx.moveTo(x, y + cellH); ctx.lineTo(x + cellW, y + cellH); ctx.stroke(); }
      if (cell.left) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cellH); ctx.stroke(); }
    }
  }

  // Start (green) and end (red) markers
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(2, 2, cellW - 4, cellH - 4);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect((cols-1) * cellW + 2, (rows-1) * cellH + 2, cellW - 4, cellH - 4);
}

// Generate musical staff
function drawMusicalStaff(canvas, notes) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);

  // Staff lines
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  const staffTop = 20;
  const spacing = (h - 40) / 8;

  for (let i = 0; i < 5; i++) {
    const y = staffTop + i * spacing;
    ctx.beginPath();
    ctx.moveTo(10, y);
    ctx.lineTo(w - 10, y);
    ctx.stroke();
  }

  // Treble clef (simplified)
  ctx.font = '48px serif';
  ctx.fillStyle = '#333';
  ctx.fillText('𝄞', 12, staffTop + 3.5 * spacing);

  // Notes
  const noteX = 60;
  const noteSpacing = (w - 80) / notes.length;

  const notePositions = { 'C4': 5.5, 'D4': 5, 'E4': 4.5, 'F4': 4, 'G4': 3.5, 'A4': 3, 'B4': 2.5, 'C5': 2, 'D5': 1.5, 'E5': 1, 'F5': 0.5 };

  for (let i = 0; i < notes.length; i++) {
    const note = notes[i];
    const pos = notePositions[note.pitch] || 3;
    const x = noteX + i * noteSpacing;
    const y = staffTop + pos * spacing;

    // Note head
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.ellipse(x, y, 7, 5, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Stem
    ctx.beginPath();
    ctx.moveTo(x + 6, y);
    ctx.lineTo(x + 6, y - 30);
    ctx.stroke();

    // Accidentals
    if (note.accidental === '#') {
      ctx.font = '16px serif';
      ctx.fillText('♯', x - 16, y + 5);
    } else if (note.accidental === 'b') {
      ctx.font = '16px serif';
      ctx.fillText('♭', x - 14, y + 5);
    }
  }
}

          document.getElementById('r-val').textContent = r;
          document.getElementById('g-val').textContent = g;
          document.getElementById('b-val').textContent = b;

          const diff = Math.sqrt(Math.pow(r-targetR,2) + Math.pow(g-targetG,2) + Math.pow(b-targetB,2));
          const maxDiff = Math.sqrt(3 * 255 * 255);
          const accuracy = Math.max(0, Math.round((1 - diff/maxDiff) * 100));
          document.getElementById('color-accuracy').textContent = accuracy;
        };

        currentAnswer = () => {
          const r = parseInt(document.getElementById('r-slider').value);
          const g = parseInt(document.getElementById('g-slider').value);
          const b = parseInt(document.getElementById('b-slider').value);
          return { r, g, b };
        };
      },
      validate: function() {
        const a = currentAnswer();
        const diff = Math.sqrt(Math.pow(a.r-this.target.r,2) + Math.pow(a.g-this.target.g,2) + Math.pow(a.b-this.target.b,2));
        return diff < 50; // Somewhat lenient
      }
    },

    // 13. Play Snake
    {
      title: 'Play Snake',
      level: 'hard',
      setup: function() {
        this.gameOver = false;
        this.score = 0;
        this.targetScore = 5;

        let html = setInstruction(`Play Snake and score at least ${this.targetScore} points`);
        html += getLevelBadge('hard');
        html += setSubtext('Use arrow keys or WASD to control the snake');
        html += `<canvas class="game-canvas" id="snake-canvas" width="360" height="280" style="height:280px" tabindex="0"></canvas>`;
        html += `<div style="text-align:center;font-size:13px;margin-top:4px">Score: <span id="snake-score">0</span> / ${this.targetScore}</div>`;

        getBody().innerHTML = html;

        const canvas = document.getElementById('snake-canvas');
        const ctx = canvas.getContext('2d');
        canvas.focus();

        const gridSize = 20;
        const cols = Math.floor(canvas.width / gridSize);
        const rows = Math.floor(canvas.height / gridSize);

        let snake = [{ x: Math.floor(cols/2), y: Math.floor(rows/2) }];
        let dir = { x: 1, y: 0 };
        let food = { x: rand(0, cols-1), y: rand(0, rows-1) };
        let gameRunning = true;
        let score = 0;

        const draw = () => {
          ctx.fillStyle = '#111';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Grid lines
          ctx.strokeStyle = '#222';
          ctx.lineWidth = 0.5;
          for (let x = 0; x < cols; x++) {
            ctx.beginPath();
            ctx.moveTo(x * gridSize, 0);
            ctx.lineTo(x * gridSize, canvas.height);
            ctx.stroke();
          }
          for (let y = 0; y < rows; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * gridSize);
            ctx.lineTo(canvas.width, y * gridSize);
            ctx.stroke();
          }

          // Food
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

          // Snake
          snake.forEach((seg, i) => {
            ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
            ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);
          });
        };

        const update = () => {
          if (!gameRunning) return;

          const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

          // Wall collision
          if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
            gameRunning = false;
            this.gameOver = true;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText('Click to restart', canvas.width/2, canvas.height/2 + 20);
            return;
          }

          // Self collision
          if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
            gameRunning = false;
            this.gameOver = true;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#e74c3c';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
            ctx.fillStyle = '#fff';
            ctx.font = '14px Arial';
            ctx.fillText('Click to restart', canvas.width/2, canvas.height/2 + 20);
            return;
          }

          snake.unshift(head);

          // Food collision
          if (head.x === food.x && head.y === food.y) {
            score++;
            this.score = score;
            document.getElementById('snake-score').textContent = score;
            food = { x: rand(0, cols-1), y: rand(0, rows-1) };
          } else {
            snake.pop();
          }

          draw();
        };

        canvas.addEventListener('click', () => {
          if (!gameRunning) {
            snake = [{ x: Math.floor(cols/2), y: Math.floor(rows/2) }];
            dir = { x: 1, y: 0 };
            food = { x: rand(0, cols-1), y: rand(0, rows-1) };
            gameRunning = true;
            this.gameOver = false;
          }
          canvas.focus();
        });

        document.addEventListener('keydown', (e) => {
          if (['ArrowUp', 'w', 'W'].includes(e.key) && dir.y !== 1) dir = { x: 0, y: -1 };
          if (['ArrowDown', 's', 'S'].includes(e.key) && dir.y !== -1) dir = { x: 0, y: 1 };
          if (['ArrowLeft', 'a', 'A'].includes(e.key) && dir.x !== 1) dir = { x: -1, y: 0 };
          if (['ArrowRight', 'd', 'D'].includes(e.key) && dir.x !== -1) dir = { x: 1, y: 0 };
          if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
        });

        this.snakeInterval = setInterval(update, 150);
        draw();

        currentAnswer = () => this.score;
      },
      validate: function() {
        clearInterval(this.snakeInterval);
        return this.score >= this.targetScore;
      }
    },

    // 14. Play Minesweeper
    {
      title: 'Complete this Minesweeper game',
      level: 'insane',
      setup: function() {
        const rows = 8;
        const cols = 8;
        const mineCount = 10;
        this.won = false;
        this.lost = false;

        // Generate mines
        const mines = new Set();
        while (mines.size < mineCount) {
          mines.add(rand(0, rows * cols - 1));
        }

        // Calculate numbers
        const grid = [];
        for (let i = 0; i < rows * cols; i++) {
          grid[i] = {
            mine: mines.has(i),
            revealed: false,
            flagged: false,
            count: 0
          };
        }

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (grid[r * cols + c].mine) continue;
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr * cols + nc].mine) count++;
              }
            }
            grid[r * cols + c].count = count;
          }
        }

        this.grid = grid;
        this.rows = rows;
        this.cols = cols;
        this.mineCount = mineCount;

        const render = () => {
          let html = setInstruction('Clear the minefield without hitting a mine');
          html += getLevelBadge('insane');
          html += setSubtext('Left-click to reveal, right-click to flag. Clear all non-mine cells to pass.');
          html += `<div style="text-align:center"><div class="minesweeper-grid" id="mine-grid" style="grid-template-columns:repeat(${cols}, 28px)">`;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const cell = grid[r * cols + c];
              let cls = 'mine-cell';
              let content = '';

              if (cell.revealed) {
                cls += ' revealed';
                if (cell.mine) {
                  cls += ' mine-exploded';
                  content = '💣';
                } else if (cell.count > 0) {
                  cls += ` mine-${cell.count}`;
                  content = cell.count;
                }
              } else if (cell.flagged) {
                cls += ' flagged';
                content = '🚩';
              }

              html += `<div class="${cls}" data-r="${r}" data-c="${c}">${content}</div>`;
            }
          }

          html += '</div></div>';

          if (this.lost) {
            html += `<div class="captcha-error">💥 BOOM! You hit a mine. Click "Verify" to try a new board.</div>`;
          } else if (this.won) {
            html += `<div class="captcha-success">🎉 Minefield cleared! Click "Verify" to continue.</div>`;
          }

          html += `<div style="text-align:center;font-size:11px;color:#888;margin-top:4px">Mines remaining: ${mineCount - grid.filter(c => c.flagged).length}</div>`;

          getBody().innerHTML = html;

          // Add click handlers
          document.querySelectorAll('.mine-cell').forEach(el => {
            el.addEventListener('click', (e) => {
              if (this.won || this.lost) return;
              const r = parseInt(el.dataset.r);
              const c = parseInt(el.dataset.c);
              revealCell(r, c);
            });

            el.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              if (this.won || this.lost) return;
              const r = parseInt(el.dataset.r);
              const c = parseInt(el.dataset.c);
              const cell = grid[r * cols + c];
              if (!cell.revealed) {
                cell.flagged = !cell.flagged;
                render();
              }
            });
          });
        };

        const revealCell = (r, c) => {
          const cell = grid[r * cols + c];
          if (cell.revealed || cell.flagged) return;

          cell.revealed = true;

          if (cell.mine) {
            this.lost = true;
            // Reveal all mines
            grid.forEach(c => { if (c.mine) c.revealed = true; });
            render();
            return;
          }

          if (cell.count === 0) {
            // Flood fill
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                  revealCell(nr, nc);
                }
              }
            }
          }

          // Check win
          const unrevealed = grid.filter(c => !c.revealed && !c.mine).length;
          if (unrevealed === 0) {
            this.won = true;
          }

          render();
        };

        render();
        currentAnswer = () => this.won;
      },
      validate: function() {
        if (this.lost) {
          // Reset for retry
          this.setup();
          return false;
        }
        return this.won;
      }
    },

    // 15. Play Pong
    {
      title: 'Play Pong',
      level: 'hard',
      setup: function() {
        this.playerScore = 0;
        this.targetScore = 3;

        let html = setInstruction(`Beat the AI at Pong (score ${this.targetScore} points)`);
        html += getLevelBadge('hard');
        html += setSubtext('Move your mouse up and down to control the left paddle');
        html += `<canvas class="game-canvas" id="pong-canvas" width="360" height="240" style="height:240px"></canvas>`;
        html += `<div style="text-align:center;font-size:13px;margin-top:4px">You: <span id="pong-player">0</span> | AI: <span id="pong-ai">0</span></div>`;

        getBody().innerHTML = html;

        const canvas = document.getElementById('pong-canvas');
        const ctx = canvas.getContext('2d');

        const paddleH = 50;
        const paddleW = 8;
        let playerY = canvas.height / 2 - paddleH / 2;
        let aiY = canvas.height / 2 - paddleH / 2;
        let ballX = canvas.width / 2;
        let ballY = canvas.height / 2;
        let ballVX = 3;
        let ballVY = 2;
        let pScore = 0;
        let aScore = 0;

        canvas.addEventListener('mousemove', (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleY = canvas.height / rect.height;
          playerY = (e.clientY - rect.top) * scaleY - paddleH / 2;
          playerY = Math.max(0, Math.min(canvas.height - paddleH, playerY));
        });

        const resetBall = () => {
          ballX = canvas.width / 2;
          ballY = canvas.height / 2;
          ballVX = (Math.random() > 0.5 ? 3 : -3);
          ballVY = randFloat(-2, 2);
        };

        const gameLoop = () => {
          // AI movement (deliberately imperfect)
          const aiCenter = aiY + paddleH / 2;
          const aiSpeed = 2.5;
          if (ballY > aiCenter + 10) aiY += aiSpeed;
          if (ballY < aiCenter - 10) aiY -= aiSpeed;
          aiY = Math.max(0, Math.min(canvas.height - paddleH, aiY));

          // Ball movement
          ballX += ballVX;
          ballY += ballVY;

          // Top/bottom bounce
          if (ballY <= 0 || ballY >= canvas.height) ballVY *= -1;

          // Paddle collisions
          if (ballX <= paddleW + 10 && ballY >= playerY && ballY <= playerY + paddleH && ballVX < 0) {
            ballVX *= -1.05;
            ballVY += randFloat(-1, 1);
          }

          if (ballX >= canvas.width - paddleW - 10 && ballY >= aiY && ballY <= aiY + paddleH && ballVX > 0) {
            ballVX *= -1.05;
            ballVY += randFloat(-1, 1);
          }

          // Scoring
          if (ballX <= 0) {
            aScore++;
            document.getElementById('pong-ai').textContent = aScore;
            resetBall();
          }
          if (ballX >= canvas.width) {
            pScore++;
            this.playerScore = pScore;
            document.getElementById('pong-player').textContent = pScore;
            resetBall();
          }

          // Draw
          ctx.fillStyle = '#111';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Center line
          ctx.setLineDash([5, 5]);
          ctx.strokeStyle = '#333';
          ctx.beginPath();
          ctx.moveTo(canvas.width/2, 0);
          ctx.lineTo(canvas.width/2, canvas.height);
          ctx.stroke();
          ctx.setLineDash([]);

          // Paddles
          ctx.fillStyle = '#4a90d9';
          ctx.fillRect(10, playerY, paddleW, paddleH);
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(canvas.width - 10 - paddleW, aiY, paddleW, paddleH);

          // Ball
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ballX, ballY, 5, 0, Math.PI * 2);
          ctx.fill();

          if (pScore < this.targetScore && aScore < 10) {
            this.pongRAF = requestAnimationFrame(gameLoop);
          } else if (pScore >= this.targetScore) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2ecc71';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('YOU WIN!', canvas.width/2, canvas.height/2);
          }
        };

        this.pongRAF = requestAnimationFrame(gameLoop);
        currentAnswer = () => this.playerScore;
      },
      validate: function() {
        cancelAnimationFrame(this.pongRAF);
        return this.playerScore >= this.targetScore;
      }
    },

    // 16. Sing a B# minor scale (microphone access)
    {

        getBody().innerHTML = html;

        window.requestMicAccess = async () => {
          try {
            document.getElementById('mic-status').textContent = 'Requesting microphone access...';

            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            this.micGranted = true;

            document.getElementById('mic-btn').style.display = 'none';
            document.getElementById('waveform').style.display = 'block';
            document.getElementById('pitch-display').style.display = 'block';
            document.getElementById('mic-status').textContent = '🔴 Recording... Sing a B♯ minor scale now!';

            // Visualize audio
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(mediaStream);
            const analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            source.connect(analyser);

            const canvas = document.getElementById('waveform');
            const ctx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const drawWave = () => {
              if (!this.micGranted) return;
              this.waveRAF = requestAnimationFrame(drawWave);

              analyser.getByteTimeDomainData(dataArray);

              ctx.fillStyle = '#1a1a1a';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.lineWidth = 2;
              ctx.strokeStyle = '#4a90d9';
              ctx.beginPath();

              const sliceWidth = canvas.width / bufferLength;
              let x = 0;
              for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += sliceWidth;
              }
              ctx.lineTo(canvas.width, canvas.height / 2);
              ctx.stroke();
            };

            drawWave();

            // Fake pitch detection
            const notes = ['C4', 'D4', 'E♭4', 'F4', 'G4', 'A♭4', 'B♭4', 'C5'];
            let noteIdx = 0;
            this.pitchInterval = setInterval(() => {
              if (noteIdx < notes.length) {
                document.getElementById('pitch-display').textContent = `Detected: ${notes[noteIdx]} ✓`;
                document.getElementById('pitch-display').style.color = '#2ecc71';
                noteIdx++;
              } else {
                clearInterval(this.pitchInterval);
                document.getElementById('mic-status').innerHTML = '✅ Scale detected! Your pitch accuracy: <strong>73%</strong> (passing)';
                document.getElementById('pitch-display').textContent = 'Analysis complete';
                this.analysisComplete = true;
              }
            }, 1500);

          } catch (err) {
            document.getElementById('mic-status').innerHTML = `Microphone access denied. <button class="btn-verify" onclick="skipMic()" style="padding:4px 12px;font-size:11px">Skip (lose 5 humanity points)</button>`;
          }
        };

        window.skipMic = () => {
          humanityScore -= 5;
          this.analysisComplete = true;
          document.getElementById('mic-status').textContent = 'Skipped. -5 humanity points.';
        };

        currentAnswer = () => this.analysisComplete;
      },
      validate: function() {
        if (this.pitchInterval) clearInterval(this.pitchInterval);
        if (this.waveRAF) cancelAnimationFrame(this.waveRAF);
        if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); }
        return this.analysisComplete;
      }
    },

    // 17. Draw a perfect circle
    {
      title: 'Draw a perfect circle',
      level: 'hard',
      setup: function() {
        let html = setInstruction('Draw a perfect circle');
        html += getLevelBadge('hard');
        html += setSubtext('Use your mouse to draw. Circularity will be measured.');
        html += `<canvas class="drawing-canvas" id="draw-canvas" width="360" height="200"></canvas>`;
        html += `<div style="text-align:center;font-size:12px;color:#888;margin-top:4px">Circularity score: <span id="circle-score">-</span></div>`;
        html += setWarning('Minimum circularity: 85%');

        getBody().innerHTML = html;

        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        let points = [];

        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        canvas.addEventListener('mousedown', (e) => {
          drawing = true;
          points = [];
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          points.push({ x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY });
        });

        canvas.addEventListener('mousemove', (e) => {
          if (!drawing) return;
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const x = (e.clientX - rect.left) * scaleX;
          const y = (e.clientY - rect.top) * scaleY;
          points.push({ x, y });

          ctx.strokeStyle = '#4a90d9';
          ctx.lineWidth = 3;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(points[points.length-2].x, points[points.length-2].y);
          ctx.lineTo(x, y);
          ctx.stroke();
        });

        canvas.addEventListener('mouseup', () => {
          drawing = false;
          if (points.length > 10) {
            // Calculate circularity
            const cx = points.reduce((s, p) => s + p.x, 0) / points.length;
            const cy = points.reduce((s, p) => s + p.y, 0) / points.length;
            const avgR = points.reduce((s, p) => s + Math.sqrt((p.x-cx)**2 + (p.y-cy)**2), 0) / points.length;
            const variance = points.reduce((s, p) => s + Math.abs(Math.sqrt((p.x-cx)**2 + (p.y-cy)**2) - avgR), 0) / points.length;
            const score = Math.max(0, Math.round((1 - variance / avgR) * 100));
            document.getElementById('circle-score').textContent = score + '%';
          }
        });

        currentAnswer = () => {
          if (points.length < 10) return 0;
          const cx = points.reduce((s, p) => s + p.x, 0) / points.length;
          const cy = points.reduce((s, p) => s + p.y, 0) / points.length;
          const avgR = points.reduce((s, p) => s + Math.sqrt((p.x-cx)**2 + (p.y-cy)**2), 0) / points.length;
          const variance = points.reduce((s, p) => s + Math.abs(Math.sqrt((p.x-cx)**2 + (p.y-cy)**2) - avgR), 0) / points.length;
          return Math.max(0, Math.round((1 - variance / avgR) * 100));
        };
      },
      validate: () => currentAnswer() >= 60
    },

    // 20. Solve a maze
    {
      title: 'Solve this maze',
      level: 'hard',
      setup: function() {
        this.solved = false;
        const rows = 15;
        const cols = 15;
        const maze = generateMaze(rows, cols);

        let html = setInstruction('Navigate from green (top-left) to red (bottom-right)');
        html += getLevelBadge('hard');
        html += setSubtext('Click cells to trace your path. Use arrow keys for step-by-step navigation.');
        html += `<canvas class="maze-canvas" id="maze-canvas" width="360" height="360" tabindex="0"></canvas>`;

        getBody().innerHTML = html;

        const canvas = document.getElementById('maze-canvas');
        const ctx = canvas.getContext('2d');
        drawMaze(canvas, maze);

        // Player position
        let playerR = 0, playerC = 0;
        const cellW = canvas.width / cols;
        const cellH = canvas.height / rows;

        const drawPlayer = () => {
          drawMaze(canvas, maze);
          ctx.fillStyle = '#4a90d9';
          ctx.beginPath();
          ctx.arc(playerC * cellW + cellW/2, playerR * cellH + cellH/2, Math.min(cellW, cellH) / 3, 0, Math.PI * 2);
          ctx.fill();
        };

        drawPlayer();

        canvas.addEventListener('keydown', (e) => {
          e.preventDefault();
          const cell = maze[playerR][playerC];

          if (e.key === 'ArrowUp' && !cell.top && playerR > 0) playerR--;
          if (e.key === 'ArrowDown' && !cell.bottom && playerR < rows - 1) playerR++;
          if (e.key === 'ArrowLeft' && !cell.left && playerC > 0) playerC--;
          if (e.key === 'ArrowRight' && !cell.right && playerC < cols - 1) playerC++;

          drawPlayer();

          if (playerR === rows - 1 && playerC === cols - 1) {
            this.solved = true;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2ecc71';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('MAZE SOLVED!', canvas.width/2, canvas.height/2);
          }
        });

        canvas.focus();
        currentAnswer = () => this.solved;
      },
      validate: function() { return this.solved; }
    },

        for (let i = 0; i < actualCount; i++) {

            x: rand(20, canvas.width - 20),
            y: rand(20, canvas.height - 20),
            vx: randFloat(-2, 2),

          });

            x: rand(20, canvas.width - 20),
            y: rand(20, canvas.height - 20),
            vx: randFloat(-2, 2),

            obj.y += obj.vy;

            }
          }

          this.countRAF = requestAnimationFrame(animate);
        };

        // Fill with chaotic colorful noise
        for (let x = 0; x < canvas.width; x += 3) {
          for (let y = 0; y < canvas.height; y += 3) {
            ctx.fillStyle = randColor();
            ctx.fillRect(x, y, 3, 3);
          }
        }

        // Draw lots of decoy shapes
        for (let i = 0; i < 100; i++) {
          ctx.strokeStyle = randColor();
          ctx.lineWidth = rand(1, 3);
          ctx.beginPath();
          const shape = rand(0, 2);
          if (shape === 0) {
            ctx.arc(rand(0, canvas.width), rand(0, canvas.height), rand(3, 15), 0, Math.PI * 2);
          } else if (shape === 1) {
            ctx.rect(rand(0, canvas.width), rand(0, canvas.height), rand(5, 20), rand(5, 20));
          } else {
            // Star-like shapes (decoys)
            const sx = rand(0, canvas.width);
            const sy = rand(0, canvas.height);
            const sr = rand(3, 8);
            for (let p = 0; p < 5; p++) {
              const angle = (p / 5) * Math.PI * 2 - Math.PI / 2;
              const px = sx + Math.cos(angle) * sr;
              const py = sy + Math.sin(angle) * sr;
              if (p === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
          }
          ctx.stroke();
        }

        // Draw the actual tiny red star
        ctx.fillStyle = '#ff0000';
        ctx.beginPath();
        for (let p = 0; p < 5; p++) {
          const angle = (p / 5) * Math.PI * 2 - Math.PI / 2;
          const outer = 4;
          const inner = 2;
          const px1 = targetX + Math.cos(angle) * outer;
          const py1 = targetY + Math.sin(angle) * outer;
          const midAngle = angle + Math.PI / 5;
          const px2 = targetX + Math.cos(midAngle) * inner;
          const py2 = targetY + Math.sin(midAngle) * inner;
          if (p === 0) ctx.moveTo(px1, py1);
          else ctx.lineTo(px1, py1);
          ctx.lineTo(px2, py2);
        }
        ctx.closePath();
        ctx.fill();

        canvas.addEventListener('click', (e) => {

          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;

          const clickY = (e.clientY - rect.top) * scaleY;

          const dist = Math.sqrt((clickX - targetX)**2 + (clickY - targetY)**2);

            document.getElementById('waldo-status').innerHTML = '⭐ Found it! Click Verify to continue.';

            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(targetX, targetY, 15, 0, Math.PI * 2);
            ctx.stroke();
          } else {
            document.getElementById('waldo-status').textContent = `Miss! Distance: ${Math.round(dist)}px away. Keep looking...`;
            document.getElementById('waldo-status').style.color = '#e74c3c';

    {

        const leftCanvas = document.getElementById('diff-left');
        const rightCanvas = document.getElementById('diff-right');
        const leftCtx = leftCanvas.getContext('2d');
        const rightCtx = rightCanvas.getContext('2d');

        // Draw identical base scene on both
        const drawScene = (ctx) => {
          ctx.fillStyle = '#87ceeb';
          ctx.fillRect(0, 0, 175, 200);

          // Ground
          ctx.fillStyle = '#228b22';
          ctx.fillRect(0, 140, 175, 60);

          ctx.arc(140, 30, 20, 0, Math.PI * 2);

          ctx.fillStyle = '#8b4513';
          ctx.beginPath();
          ctx.moveTo(20, 80);
          ctx.lineTo(60, 50);
          ctx.lineTo(100, 80);
          ctx.closePath();
          ctx.fill();

          // Door
          ctx.fillStyle = '#6d4c41';
          ctx.fillRect(50, 110, 20, 30);

          // Window
          ctx.fillStyle = '#87ceeb';
          ctx.fillRect(35, 90, 15, 15);

          // Tree
          ctx.fillStyle = '#4a2f1a';
          ctx.fillRect(130, 100, 10, 40);
          ctx.fillStyle = '#228b22';
          ctx.beginPath();
          ctx.arc(135, 85, 25, 0, Math.PI * 2);
          ctx.fill();

          // Cloud
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(60, 25, 15, 0, Math.PI * 2);
          ctx.arc(75, 20, 18, 0, Math.PI * 2);
          ctx.arc(90, 25, 14, 0, Math.PI * 2);
          ctx.fill();

          // Flowers
          for (let i = 0; i < 5; i++) {
            ctx.fillStyle = pick(['#e74c3c', '#f1c40f', '#e91e63']);
            ctx.beginPath();
            ctx.arc(20 + i * 30, 155, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        };

        drawScene(leftCtx);
        drawScene(rightCtx);

        // Add differences to the right image
        const diffs = [
          { x: 140, y: 30, r: 22, action: () => { rightCtx.fillStyle = '#e67e22'; rightCtx.beginPath(); rightCtx.arc(140, 30, 20, 0, Math.PI * 2); rightCtx.fill(); } },
          { x: 60, y: 50, r: 15, action: () => { rightCtx.fillStyle = '#3498db'; rightCtx.beginPath(); rightCtx.moveTo(20, 80); rightCtx.lineTo(60, 45); rightCtx.lineTo(100, 80); rightCtx.closePath(); rightCtx.fill(); } },
          { x: 135, y: 85, r: 20, action: () => { rightCtx.fillStyle = '#27ae60'; rightCtx.beginPath(); rightCtx.arc(135, 85, 30, 0, Math.PI * 2); rightCtx.fill(); } },
          { x: 75, y: 22, r: 20, action: () => { /* cloud removed - draw sky */ rightCtx.fillStyle = '#87ceeb'; rightCtx.fillRect(40, 5, 70, 40); } },
          { x: 50, y: 155, r: 15, action: () => { rightCtx.fillStyle = '#228b22'; rightCtx.fillRect(40, 148, 30, 15); } },
        ];

        const foundDiffs = new Set();
        diffs.forEach(d => d.action());

        const handleClick = (e) => {
          const canvas = e.target;
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const x = (e.clientX - rect.left) * scaleX;
          const y = (e.clientY - rect.top) * scaleY;

          for (let i = 0; i < diffs.length; i++) {
            if (foundDiffs.has(i)) continue;
            const d = diffs[i];
            const dist = Math.sqrt((x - d.x)**2 + (y - d.y)**2);
            if (dist < d.r + 10) {
              foundDiffs.add(i);
              this.found = foundDiffs.size;
              document.getElementById('diff-count').textContent = this.found;

              // Circle the difference on both canvases
              [leftCtx, rightCtx].forEach(ctx => {
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.stroke();
              });
              break;
            }
          }
        };

        rightCanvas.addEventListener('click', handleClick);
        leftCanvas.addEventListener('click', handleClick);

        currentAnswer = () => this.found;
      },
      validate: function() { return this.found >= 3; }
    },

    // 47. Map challenge - find a location
    {
      title: 'GeoLocation Challenge',
      level: 'insane',
      setup: function() {
        const locations = [
          { name: 'approximately where the Eiffel Tower is', x: 0.47, y: 0.35 },
          { name: 'approximately where the Great Wall of China is', x: 0.78, y: 0.33 },
          { name: 'approximately where the Statue of Liberty is', x: 0.22, y: 0.35 },
          { name: 'approximately where the Sydney Opera House is', x: 0.87, y: 0.72 },
          { name: 'approximately where Machu Picchu is', x: 0.21, y: 0.58 },
        ];

        const loc = pick(locations);
        this.targetX = loc.x;
        this.targetY = loc.y;
        this.found = false;

        let html = setInstruction(`Click ${loc.name} on this world map`);
        html += getLevelBadge('insane');
        html += `<canvas class="map-canvas" id="map-canvas" width="360" height="250"></canvas>`;
        html += `<div id="map-status" style="text-align:center;font-size:12px;color:#888;margin-top:4px">Click on the map</div>`;

        getBody().innerHTML = html;

        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');

        // Draw a crude world map
        ctx.fillStyle = '#4a90d9';
        ctx.fillRect(0, 0, 360, 250);

        // Continents (very rough)
        ctx.fillStyle = '#2ecc71';

        // North America
        ctx.beginPath();
        ctx.moveTo(20, 30); ctx.lineTo(100, 25); ctx.lineTo(120, 50);
        ctx.lineTo(110, 80); ctx.lineTo(90, 100); ctx.lineTo(70, 110);
        ctx.lineTo(50, 100); ctx.lineTo(30, 80); ctx.lineTo(15, 50);
        ctx.closePath(); ctx.fill();

        // South America
        ctx.beginPath();
        ctx.moveTo(70, 115); ctx.lineTo(95, 120); ctx.lineTo(100, 150);
        ctx.lineTo(90, 190); ctx.lineTo(75, 200); ctx.lineTo(60, 180);
        ctx.lineTo(55, 150); ctx.lineTo(60, 130);
        ctx.closePath(); ctx.fill();

        // Europe
        ctx.beginPath();
        ctx.moveTo(150, 25); ctx.lineTo(190, 20); ctx.lineTo(200, 40);
        ctx.lineTo(195, 65); ctx.lineTo(180, 80); ctx.lineTo(160, 75);
        ctx.lineTo(150, 55);
        ctx.closePath(); ctx.fill();

        // Africa
        ctx.beginPath();
        ctx.moveTo(155, 85); ctx.lineTo(195, 80); ctx.lineTo(210, 100);
        ctx.lineTo(205, 150); ctx.lineTo(185, 180); ctx.lineTo(165, 175);
        ctx.lineTo(150, 140); ctx.lineTo(145, 110);
        ctx.closePath(); ctx.fill();

        // Asia
        ctx.beginPath();
        ctx.moveTo(200, 20); ctx.lineTo(320, 15); ctx.lineTo(330, 50);
        ctx.lineTo(310, 80); ctx.lineTo(280, 100); ctx.lineTo(250, 90);
        ctx.lineTo(220, 80); ctx.lineTo(200, 50);
        ctx.closePath(); ctx.fill();

        // Australia
        ctx.beginPath();
        ctx.moveTo(290, 150); ctx.lineTo(335, 145); ctx.lineTo(340, 175);
        ctx.lineTo(320, 190); ctx.lineTo(295, 185); ctx.lineTo(285, 170);
        ctx.closePath(); ctx.fill();

        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;

          const dist = Math.sqrt((x - this.targetX)**2 + (y - this.targetY)**2);

          // Draw click marker
          const cx = x * canvas.width;
          const cy = y * canvas.height;
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath();
          ctx.arc(cx, cy, 5, 0, Math.PI * 2);
          ctx.fill();

          if (dist < 0.1) {
            this.found = true;
            document.getElementById('map-status').innerHTML = '✅ Close enough! Location found.';
            document.getElementById('map-status').style.color = '#2ecc71';
          } else {
            document.getElementById('map-status').textContent = `Not quite. Distance: ${Math.round(dist * 100)}% off. Try again.`;
            document.getElementById('map-status').style.color = '#e74c3c';
          }
        });

        currentAnswer = () => this.found;
      },
      validate: function() { return this.found; }
    },

        let html = setInstruction('Type this text as fast as you can');
        html += getLevelBadge('hard');

        html += `<textarea class="captcha-textarea" id="typing-input" placeholder="Start typing..." style="min-height:60px;font-size:14px"></textarea>`;
        html += `<div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:4px">`;
        html += `<span>WPM: <span id="wpm">0</span></span>`;

        html += `</div>`;

        getBody().innerHTML = html;

        let startTime = null;
        const input = document.getElementById('typing-input');

        input.addEventListener('input', () => {
          if (!startTime) startTime = Date.now();

          const typed = input.value;
          const elapsed = (Date.now() - startTime) / 1000 / 60; // minutes
          const words = typed.trim().split(/\s+/).length;
          const wpm = Math.round(words / Math.max(elapsed, 0.01));
          document.getElementById('wpm').textContent = wpm;

          // Accuracy
          let correct = 0;
          for (let i = 0; i < Math.min(typed.length, text.length); i++) {
            if (typed[i] === text[i]) correct++;
          }
          const accuracy = Math.round((correct / Math.max(typed.length, 1)) * 100);
          document.getElementById('typing-accuracy').textContent = accuracy;
        });

        currentAnswer = () => document.getElementById('typing-input').value;
      },
      validate: function() {
        const typed = currentAnswer();
        return typed.length >= this.targetText.length * 0.8;
      }

}
