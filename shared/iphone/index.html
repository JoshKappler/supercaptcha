<title>Pushary iPhone component</title>
<link rel="stylesheet" href="iphone.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #070708; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter iPhone", system-ui, sans-serif;
    color: rgba(255, 255, 255, .56);
    background:
      radial-gradient(60% 55% at 42% 38%, rgba(255, 150, 90, .09), rgba(255, 150, 90, 0) 70%),
      radial-gradient(40% 45% at 72% 45%, rgba(170, 60, 90, .07), rgba(170, 60, 90, 0) 70%),
      #070708;
  }
  .stage { display: flex; align-items: flex-start; justify-content: center; gap: 96px; padding: 28px 16px; }
  figure { margin: 0; display: grid; justify-items: center; gap: 14px; }
  figcaption { font-size: 13px; line-height: 16px; letter-spacing: .01em; }
  .iphone { --iphone-w: min(380px, calc((100vh - 86px) * 1470 / 3000)); }
  @media (max-width: 860px) {
    .stage { flex-direction: column; align-items: center; gap: 48px; }
    .iphone { --iphone-w: min(330px, 84vw); }
  }
</style>
</head>
