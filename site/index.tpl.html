<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pushary redesigns</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #f5f5f7; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 64px 16px; }
  p { color: #a1a1a6; margin: 0 0 32px; }
  ul { list-style: none; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  a { display: block; padding: 20px; border: 1px solid #ffffff14; border-radius: 16px; color: inherit; text-decoration: none; }
  a:hover { border-color: #ffffff33; }
  small { display: block; color: #86868b; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <p>Use the left and right arrow keys to cycle.</p>
  <ul>
__TILES__
  </ul>
</main>
<script src="/cycle.js" defer></script>
</body>
</html>
